<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 656" width="980" height="656" role="img" aria-label="Taxonomy of training paradigms"><style>
 :root{--ink:#111418;--mut:#5b6672;--line:#c3ccd4;--bg:#ffffff;--a:#2f6f9f;--b:#7a5ea8;--c:#a8563e;--d:#3f7d57;--warn:#b5462f;--fill:#eef3f7;--fill2:#f4f1f8}
 @media (prefers-color-scheme:dark){:root{--ink:#e8ecef;--mut:#9aa6b2;--line:#3d4750;--bg:#12161a;--a:#6fb0dc;--b:#b295d8;--c:#dd9376;--d:#7fc09a;--warn:#e88a72;--fill:#1b232a;--fill2:#221e2b}}
 text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
 .t{font-size:15px;font-weight:600}.s{font-size:11px;fill:var(--mut)}.l{font-size:11px}
 .n{font-size:9.5px;fill:var(--mut)}.h{font-size:11.5px;font-weight:600}
 .k{font-size:9px;fill:var(--mut);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
 .box{fill:var(--fill);stroke:var(--line);stroke-width:1}
 .ghost{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
 .ed{stroke:var(--mut);fill:none;opacity:.55}.tree{stroke:var(--line);fill:none;stroke-width:1.2}
</style><rect width="980" height="656" fill="var(--bg)"/><text class="t" x="24" y="28">Figure 4. What supervises a dexterous policy</text><text class="s" x="24" y="48">Four kinds of supervision, subdivided to the level at which the 110 method papers actually differ.</text><text class="s" x="24" y="64">Counts are recomputed from corpus/rows and a paper may appear under more than one branch.</text><rect class="box" x="24" y="362.2" width="150" height="52" rx="4"/><text class="l" x="99" y="380.2" text-anchor="middle">supervision for a</text><text class="l" x="99" y="394.2" text-anchor="middle">dexterous policy</text><text class="n" x="99" y="408.2" text-anchor="middle">110 method papers</text><rect class="box" x="210" y="118" width="235" height="104" rx="4" stroke="var(--a)"/><text class="h" x="220" y="136" fill="var(--a)">a reward function</text><text class="n" x="435" y="136" text-anchor="end">53</text><path class="tree" d="M174,388.2 C204,388.2 180,170.0 210,170.0" stroke="var(--a)" opacity=".6"/><text class="l" x="470" y="138">PPO in a GPU simulator, privileged state</text><text class="n" x="458" y="138" text-anchor="end">32</text><path class="tree" d="M445,170.0 C460,170.0 430,135 442,135" stroke="var(--a)" opacity=".45"/><text class="k" x="470" y="149">physhoi 23, force grasp sim2real 26, dexman 25, twisting lids 24, dexmachina 25</text><text class="l" x="470" y="164">plus teacher-student distillation to vision</text><text class="n" x="458" y="164" text-anchor="end">23</text><path class="tree" d="M445,170.0 C460,170.0 430,161 442,161" stroke="var(--a)" opacity=".45"/><text class="k" x="470" y="175">pianomime 24, visual dexterity 22, unidexgrasp 23, dexplore 25, resdex 24</text><text class="l" x="470" y="190">reward written by a language model</text><text class="n" x="458" y="190" text-anchor="end">2</text><path class="tree" d="M445,170.0 C460,170.0 430,187 442,187" stroke="var(--a)" opacity=".45"/><text class="k" x="470" y="201">dreureka 24, eureka 23</text><text class="l" x="470" y="216">seeded by demonstrations</text><text class="n" x="458" y="216" text-anchor="end">6</text><path class="tree" d="M445,170.0 C460,170.0 430,213 442,213" stroke="var(--a)" opacity=".45"/><text class="k" x="470" y="227">pianomime 24, dexmv 21, dextrack 25, dapg 17, dime 22</text><rect class="box" x="210" y="248" width="235" height="104" rx="4" stroke="var(--d)"/><text class="h" x="220" y="266" fill="var(--d)">a human demonstration</text><text class="n" x="435" y="266" text-anchor="end">49</text><path class="tree" d="M174,388.2 C204,388.2 180,300.0 210,300.0" stroke="var(--d)" opacity=".6"/><text class="l" x="470" y="268">teleoperated on the target robot</text><text class="n" x="458" y="268" text-anchor="end">14</text><path class="tree" d="M445,300.0 C460,300.0 430,265 442,265" stroke="var(--d)" opacity=".45"/><text class="k" x="470" y="279">dexteleop0 26, dexora 26, open television 24, dexpilot 20, geometric retargeting 25</text><text class="l" x="470" y="294">wearable rig, no robot in the loop</text><text class="n" x="458" y="294" text-anchor="end">3</text><path class="tree" d="M445,300.0 C460,300.0 430,291 442,291" stroke="var(--d)" opacity=".45"/><text class="k" x="470" y="305">dexcap 24, dexwild 25, dexumi 25</text><text class="l" x="470" y="320">egocentric video, no robot at all</text><text class="n" x="458" y="320" text-anchor="end">7</text><path class="tree" d="M445,300.0 C460,300.0 430,317 442,317" stroke="var(--d)" opacity=".45"/><text class="k" x="470" y="331">videodex 22, okami 24, hudor 24, egozero 25, dexvip 22</text><text class="l" x="470" y="346">synthetic demonstration generation</text><text class="n" x="458" y="346" text-anchor="end">10</text><path class="tree" d="M445,300.0 C460,300.0 430,343 442,343" stroke="var(--d)" opacity=".45"/><text class="k" x="470" y="357">videodex 22, dexmv 21, dexmimicgen 24, dexcap 24, dexwild 25</text><rect class="box" x="210" y="378" width="235" height="104" rx="4" stroke="var(--b)"/><text class="h" x="220" y="396" fill="var(--b)">a human reference, tracked with physics</text><text class="n" x="435" y="396" text-anchor="end">12</text><path class="tree" d="M174,388.2 C204,388.2 180,430.0 210,430.0" stroke="var(--b)" opacity=".6"/><text class="l" x="470" y="398">whole reference including fingers</text><text class="n" x="458" y="398" text-anchor="end">4</text><path class="tree" d="M445,430.0 C460,430.0 430,395 442,395" stroke="var(--b)" opacity=".45"/><text class="k" x="470" y="409">dexmachina 25, toporetarget 26, maniptrans 25, dextrack 25</text><text class="l" x="470" y="424">wrist only, fingers learned</text><text class="n" x="458" y="424" text-anchor="end">1</text><path class="tree" d="M445,430.0 C460,430.0 430,421 442,421" stroke="var(--b)" opacity=".45"/><text class="k" x="470" y="435">objdex 24</text><text class="l" x="470" y="450">object trajectory only</text><text class="n" x="458" y="450" text-anchor="end">2</text><path class="tree" d="M445,430.0 C460,430.0 430,447 442,447" stroke="var(--b)" opacity=".45"/><text class="k" x="470" y="461">pgdm 23, human2sim2robot 25</text><text class="l" x="470" y="476">reference as soft guidance</text><text class="n" x="458" y="476" text-anchor="end">3</text><path class="tree" d="M445,430.0 C460,430.0 430,473 442,473" stroke="var(--b)" opacity=".45"/><text class="k" x="470" y="487">physhoi 23, dexplore 25, omnigrasp 24</text><rect class="box" x="210" y="508" width="235" height="78" rx="4" stroke="var(--c)"/><text class="h" x="220" y="526" fill="var(--c)">no learned policy</text><text class="n" x="435" y="526" text-anchor="end">11</text><path class="tree" d="M174,388.2 C204,388.2 180,547.0 210,547.0" stroke="var(--c)" opacity=".6"/><text class="l" x="470" y="528">sampled plan, learned model</text><text class="n" x="458" y="528" text-anchor="end">1</text><path class="tree" d="M445,547.0 C460,547.0 430,525 442,525" stroke="var(--c)" opacity=".45"/><text class="k" x="470" y="539">pddm 19</text><text class="l" x="470" y="554">sampled plan, given model</text><text class="n" x="458" y="554" text-anchor="end">1</text><path class="tree" d="M445,547.0 C460,547.0 430,551 442,551" stroke="var(--c)" opacity=".45"/><text class="k" x="470" y="565">mjpc 22</text><text class="l" x="470" y="580">smoothed analytic contact model</text><text class="n" x="458" y="580" text-anchor="end">1</text><path class="tree" d="M445,547.0 C460,547.0 430,577 442,577" stroke="var(--c)" opacity=".45"/><text class="k" x="470" y="591">pang global planning 22</text><text class="s" x="24" y="618">The branches are not exclusive. Most work after 2024 trains with a reward in simulation and ships something</text><text class="s" x="24" y="634">shaped like an imitation policy, so it belongs to the first branch and the second at once.</text></svg>