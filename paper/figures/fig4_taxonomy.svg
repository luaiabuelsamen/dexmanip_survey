<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 750" width="980" height="750" role="img" aria-label="Taxonomy of training paradigms"><style>
 :root{--ink:#111418;--mut:#5b6672;--line:#c3ccd4;--bg:#ffffff;--a:#2f6f9f;--b:#7a5ea8;--c:#a8563e;--d:#3f7d57;--warn:#b5462f;--fill:#eef3f7;--fill2:#f4f1f8}
 @media (prefers-color-scheme:dark){:root{--ink:#e8ecef;--mut:#9aa6b2;--line:#3d4750;--bg:#12161a;--a:#6fb0dc;--b:#b295d8;--c:#dd9376;--d:#7fc09a;--warn:#e88a72;--fill:#1b232a;--fill2:#221e2b}}
 text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
 .t{font-size:15px;font-weight:600}.s{font-size:11px;fill:var(--mut)}.l{font-size:11px}
 .n{font-size:9.5px;fill:var(--mut)}.h{font-size:11.5px;font-weight:600}
 .k{font-size:9px;fill:var(--mut);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
 .box{fill:var(--fill);stroke:var(--line);stroke-width:1}
 .ghost{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
 .ed{stroke:var(--mut);fill:none;opacity:.55}.tree{stroke:var(--line);fill:none;stroke-width:1.2}
</style><rect width="980" height="750" fill="var(--bg)"/><text class="t" x="24" y="28">Figure 4. What supervises a dexterous policy</text><text class="s" x="24" y="48">Four kinds of supervision, subdivided to the level at which the 112 method papers actually differ.</text><text class="s" x="24" y="64">Every leaf count is the rows its stated predicate selects, recomputed from corpus/rows; a paper may appear more than once.</text><rect class="box" x="24" y="401.2" width="150" height="52" rx="4"/><text class="l" x="99" y="419.2" text-anchor="middle">supervision for a</text><text class="l" x="99" y="433.2" text-anchor="middle">dexterous policy</text><text class="n" x="99" y="447.2" text-anchor="middle">112 method papers</text><rect class="box" x="210" y="118" width="235" height="130" rx="4" stroke="var(--a)"/><text class="h" x="220" y="136" fill="var(--a)">a reward function</text><text class="n" x="435" y="136" text-anchor="end">59</text><text class="n" x="435" y="150" text-anchor="end">41 of 59 in a leaf</text><path class="tree" d="M174,427.2 C204,427.2 180,183.0 210,183.0" stroke="var(--a)" opacity=".6"/><text class="l" x="470" y="138">PPO in a GPU-parallel simulator, no distillation stage</text><text class="n" x="458" y="138" text-anchor="end">20</text><path class="tree" d="M445,183.0 C460,183.0 430,135 442,135" stroke="var(--a)" opacity=".45"/><text class="k" x="470" y="149">physhoi 23, force grasp sim2real 26, dexman 25, twisting lids 24, dexmachina 25, and 15 more</text><text class="l" x="470" y="164">plus teacher-student distillation</text><text class="n" x="458" y="164" text-anchor="end">16</text><path class="tree" d="M445,183.0 C460,183.0 430,161 442,161" stroke="var(--a)" opacity=".45"/><text class="k" x="470" y="175">visual dexterity 22, unidexgrasp 23, dexplore 25, resdex 24, penspin 24, and 11 more</text><text class="l" x="488" y="190">— of which the student is a vision policy</text><text class="n" x="458" y="190" text-anchor="end">5</text><text class="k" x="488" y="201">hora 22, visual dexterity 22, rotateit 23, robot synesthesia 23, viserdex 26</text><text class="l" x="470" y="216">reward written by a language model</text><text class="n" x="458" y="216" text-anchor="end">2</text><path class="tree" d="M445,183.0 C460,183.0 430,213 442,213" stroke="var(--a)" opacity=".45"/><text class="k" x="470" y="227">eureka 23, dreureka 24</text><text class="l" x="470" y="242">seeded by demonstrations (the RL+demo tag)</text><text class="n" x="458" y="242" text-anchor="end">6</text><path class="tree" d="M445,183.0 C460,183.0 430,239 442,239" stroke="var(--a)" opacity=".45"/><text class="k" x="470" y="253">pianomime 24, dexmv 21, dextrack 25, dapg 17, dime 22, and 1 more</text><rect class="box" x="210" y="274" width="235" height="104" rx="4" stroke="var(--d)"/><text class="h" x="220" y="292" fill="var(--d)">a human demonstration</text><text class="n" x="435" y="292" text-anchor="end">44</text><text class="n" x="435" y="306" text-anchor="end">26 of 44 in a leaf</text><path class="tree" d="M174,427.2 C204,427.2 180,326.0 210,326.0" stroke="var(--d)" opacity=".6"/><text class="l" x="470" y="294">teleoperated on the target robot</text><text class="n" x="458" y="294" text-anchor="end">14</text><path class="tree" d="M445,326.0 C460,326.0 430,291 442,291" stroke="var(--d)" opacity=".45"/><text class="k" x="470" y="305">dexteleop0 26, dexora 26, open television 24, dexpilot 20, geometric retargeting 25, and 9 more</text><text class="l" x="470" y="320">wearable or hand-held rig, no robot in the loop</text><text class="n" x="458" y="320" text-anchor="end">4</text><path class="tree" d="M445,326.0 C460,326.0 430,317 442,317" stroke="var(--d)" opacity=".45"/><text class="k" x="470" y="331">dexcap 24, dexumi 25, dexwild 25, umi 24</text><text class="l" x="470" y="346">egocentric video, no robot at all</text><text class="n" x="458" y="346" text-anchor="end">7</text><path class="tree" d="M445,326.0 C460,326.0 430,343 442,343" stroke="var(--d)" opacity=".45"/><text class="k" x="470" y="357">dexmv 21, videodex 22, dexvip 22, okami 24, human2sim2robot 25, and 2 more</text><text class="l" x="470" y="372">synthetic demonstration generation</text><text class="n" x="458" y="372" text-anchor="end">2</text><path class="tree" d="M445,326.0 C460,326.0 430,369 442,369" stroke="var(--d)" opacity=".45"/><text class="k" x="470" y="383">dexmimicgen 24, deximit 26</text><rect class="box" x="210" y="404" width="235" height="156" rx="4" stroke="var(--b)"/><text class="h" x="220" y="422" fill="var(--b)">a human reference, tracked with physics</text><text class="n" x="435" y="422" text-anchor="end">12</text><path class="tree" d="M174,427.2 C204,427.2 180,482.0 210,482.0" stroke="var(--b)" opacity=".6"/><text class="l" x="470" y="424">whole reference including fingers</text><text class="n" x="458" y="424" text-anchor="end">4</text><path class="tree" d="M445,482.0 C460,482.0 430,421 442,421" stroke="var(--b)" opacity=".45"/><text class="k" x="470" y="435">dextrack 25, maniptrans 25, dexmachina 25, toporetarget 26</text><text class="l" x="470" y="450">wrist only, fingers learned</text><text class="n" x="458" y="450" text-anchor="end">1</text><path class="tree" d="M445,482.0 C460,482.0 430,447 442,447" stroke="var(--b)" opacity=".45"/><text class="k" x="470" y="461">objdex 24</text><text class="l" x="470" y="476">object trajectory only</text><text class="n" x="458" y="476" text-anchor="end">1</text><path class="tree" d="M445,482.0 C460,482.0 430,473 442,473" stroke="var(--b)" opacity=".45"/><text class="k" x="470" y="487">human2sim2robot 25</text><text class="l" x="470" y="502">reference as soft guidance</text><text class="n" x="458" y="502" text-anchor="end">1</text><path class="tree" d="M445,482.0 C460,482.0 430,499 442,499" stroke="var(--b)" opacity=".45"/><text class="k" x="470" y="513">dexplore 25</text><text class="l" x="470" y="528">no retargeting, reference already on the embodiment</text><text class="n" x="458" y="528" text-anchor="end">2</text><path class="tree" d="M445,482.0 C460,482.0 430,525 442,525" stroke="var(--b)" opacity=".45"/><text class="k" x="470" y="539">physhoi 23, omnigrasp 24</text><text class="l" x="470" y="554">whole-body humanoid, hands carried with the body</text><text class="n" x="458" y="554" text-anchor="end">3</text><path class="tree" d="M445,482.0 C460,482.0 430,551 442,551" stroke="var(--b)" opacity=".45"/><text class="k" x="470" y="565">dexman 25, humanplus 24, omnih2o 24</text><rect class="box" x="210" y="586" width="235" height="78" rx="4" stroke="var(--c)"/><text class="h" x="220" y="604" fill="var(--c)">no learned policy</text><text class="n" x="435" y="604" text-anchor="end">3</text><path class="tree" d="M174,427.2 C204,427.2 180,625.0 210,625.0" stroke="var(--c)" opacity=".6"/><text class="l" x="470" y="606">sampled plan, learned model</text><text class="n" x="458" y="606" text-anchor="end">1</text><path class="tree" d="M445,625.0 C460,625.0 430,603 442,603" stroke="var(--c)" opacity=".45"/><text class="k" x="470" y="617">pddm 19</text><text class="l" x="470" y="632">sampled plan, given model</text><text class="n" x="458" y="632" text-anchor="end">1</text><path class="tree" d="M445,625.0 C460,625.0 430,629 442,629" stroke="var(--c)" opacity=".45"/><text class="k" x="470" y="643">mjpc 22</text><text class="l" x="470" y="658">smoothed analytic contact model</text><text class="n" x="458" y="658" text-anchor="end">1</text><path class="tree" d="M445,625.0 C460,625.0 430,655 442,655" stroke="var(--c)" opacity=".45"/><text class="k" x="470" y="669">pang global planning 22</text><text class="s" x="24" y="696">The branches are not exclusive. Most work after 2024 trains with a reward in simulation and ships something</text><text class="s" x="24" y="712">shaped like an imitation policy, so it belongs to the first branch and the second at once. Eight further rows carry</text><text class="s" x="24" y="728">a trajectory-optimisation or MPC tag inside a learned pipeline and are counted on the branch that learns.</text></svg>