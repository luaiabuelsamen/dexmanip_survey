<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 556" width="820" height="556" role="img" aria-label="A simulation step and where engines differ"><style>
 :root{--ink:#111418;--mut:#5b6672;--line:#c3ccd4;--bg:#ffffff;--a:#2f6f9f;--b:#7a5ea8;--c:#a8563e;--d:#3f7d57;--warn:#b5462f;--fill:#eef3f7;--fill2:#f4f1f8}
 @media (prefers-color-scheme:dark){:root{--ink:#e8ecef;--mut:#9aa6b2;--line:#3d4750;--bg:#12161a;--a:#6fb0dc;--b:#b295d8;--c:#dd9376;--d:#7fc09a;--warn:#e88a72;--fill:#1b232a;--fill2:#221e2b}}
 text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
 .t{font-size:15px;font-weight:600}.s{font-size:11.5px;fill:var(--mut)}.l{font-size:11.5px}
 .n{font-size:10px;fill:var(--mut)}.h{font-size:12px;font-weight:600}
 .k{font-size:9px;fill:var(--mut);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 .cnt{font-size:13px;font-weight:700;fill:var(--a)}
 .box{fill:var(--fill);stroke:var(--line);stroke-width:1}
 .box2{fill:var(--fill2);stroke:var(--line);stroke-width:1}
 .ed{stroke:var(--mut);stroke-width:1.2;fill:none}
 .edw{stroke:var(--warn);stroke-width:1.4;fill:none;stroke-dasharray:4 3}
</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
<path d="M0,0 L7,3 L0,6 z" fill="var(--mut)"/></marker>
<marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
<path d="M0,0 L7,3 L0,6 z" fill="var(--warn)"/></marker></defs><rect width="820" height="556" fill="var(--bg)"/><text class="t" x="24" y="30">Figure 3. One simulation step, and where engines differ</text><text class="s" x="24" y="50">The stages every rigid-body engine runs. Under each, the choices that separate the engines used for hands.</text><text class="s" x="24" y="66">Dashed red marks the three stages that make overlap. They do not answer to the same knob.</text><rect class="box" x="28" y="92" width="140" height="46" rx="4"/><text class="l" style="font-size:11.5px" x="98.0" y="116.0" text-anchor="middle">broad phase</text><text class="n" x="98.0" y="132.0" text-anchor="middle">which pairs might touch</text><path class="ed" d="M168,115.0 L181,115.0" marker-end="url(#ar)"/><rect class="box" x="184" y="92" width="140" height="46" rx="4"/><text class="l" style="font-size:11.5px" x="254.0" y="116.0" text-anchor="middle">narrow phase</text><text class="n" x="254.0" y="132.0" text-anchor="middle">contact points and normals</text><path class="ed" d="M324,115.0 L337,115.0" marker-end="url(#ar)"/><rect class="box" x="340" y="92" width="140" height="46" rx="4"/><text class="l" style="font-size:11.5px" x="410.0" y="116.0" text-anchor="middle">constraint assembly</text><text class="n" x="410.0" y="132.0" text-anchor="middle">friction cone, limits</text><path class="ed" d="M480,115.0 L493,115.0" marker-end="url(#ar)"/><rect class="box" x="496" y="92" width="140" height="46" rx="4"/><text class="l" style="font-size:11.5px" x="566.0" y="116.0" text-anchor="middle">solver</text><text class="n" x="566.0" y="132.0" text-anchor="middle">velocities and impulses</text><path class="ed" d="M636,115.0 L649,115.0" marker-end="url(#ar)"/><rect class="box" x="652" y="92" width="140" height="46" rx="4"/><text class="l" style="font-size:11.5px" x="722.0" y="116.0" text-anchor="middle">integrate</text><text class="n" x="722.0" y="132.0" text-anchor="middle">advance state</text><line class="ed" x1="98.0" y1="138" x2="98.0" y2="162" stroke-dasharray="2 3"/><text class="n" x="98.0" y="168" text-anchor="middle">PhysX: GPU SAP</text><text class="n" x="98.0" y="183" text-anchor="middle">MuJoCo: broadphase</text><text class="n" x="98.0" y="198" text-anchor="middle">Genesis: libccd, islands</text><line class="ed" x1="254.0" y1="138" x2="254.0" y2="162" stroke-dasharray="2 3"/><text class="n" x="254.0" y="168" text-anchor="middle">MuJoCo: convex, analytic</text><text class="n" x="254.0" y="183" text-anchor="middle">PhysX: SDF or convex hull</text><text class="n" x="254.0" y="198" text-anchor="middle">Dojo: primitives vs planes</text><line class="ed" x1="410.0" y1="138" x2="410.0" y2="162" stroke-dasharray="2 3"/><text class="n" x="410.0" y="168" text-anchor="middle">MuJoCo: soft, elliptic cone</text><text class="n" x="410.0" y="183" text-anchor="middle">Drake SAP: convex, regularised</text><text class="n" x="410.0" y="198" text-anchor="middle">Dojo: NCP, hard</text><line class="ed" x1="566.0" y1="138" x2="566.0" y2="162" stroke-dasharray="2 3"/><text class="n" x="566.0" y="168" text-anchor="middle">MuJoCo: PGS/CG/Newton</text><text class="n" x="566.0" y="183" text-anchor="middle">PhysX: TGS, fixed iters</text><text class="n" x="566.0" y="198" text-anchor="middle">Dojo: interior point</text><text class="n" x="566.0" y="213" text-anchor="middle">ComFree: closed form</text><line class="ed" x1="722.0" y1="138" x2="722.0" y2="162" stroke-dasharray="2 3"/><text class="n" x="722.0" y="168" text-anchor="middle">semi-implicit Euler</text><text class="n" x="722.0" y="183" text-anchor="middle">symplectic Euler (Brax)</text><text class="n" x="722.0" y="198" text-anchor="middle">RK4 (MuJoCo)</text><rect class="box2" x="28" y="260" width="764" height="262" rx="4"/><text class="h" x="44" y="282">Where penetration comes from: three sources on different knobs. Which one dominates in a hand has not been measured.</text><text class="n" x="44" y="302">&#8226; Velocity-level enforcement. Where non-penetration is enforced on velocities, any residual approach velocity is</text><text class="n" x="44" y="316">&#160;&#160;&#160;integrated into overlap of order v&#183;&#916;t. Illustration under an assumption, not a measurement: a fingertip closing at</text><text class="n" x="44" y="330">&#160;&#160;&#160;0.5 m/s &#8212; a speed no source in this survey reports &#8212; at Isaac Gym&#8217;s 1/120 s Shadow Hand step gives about 4 mm before the</text><text class="n" x="44" y="344">&#160;&#160;&#160;next step&#8217;s constraint acts. Engines that enforce the gap at the next configuration carry no such term: Dojo&#8217;s</text><text class="n" x="44" y="358">&#160;&#160;&#160;hard-contact NCP holds its feet above the floor at &#916;t = 0.1, 0.01 and 0.001 s alike.</text><text class="n" x="44" y="372">&#8226; The prescribed compliance. A regularised contact rests at a violation equal to the normal load times the compliance</text><text class="n" x="44" y="386">&#160;&#160;&#160;that was chosen for it. It is zero at zero load, and MuJoCo&#8217;s closed form is independent of the object&#8217;s mass. The depth</text><text class="n" x="44" y="400">&#160;&#160;&#160;is a setting, and no engine paper in Table 4 other than ComFree-Sim states the setting it ships.</text><text class="n" x="44" y="414">&#8226; Solver truncation. A truncated solve degrades with the conditioning of the problem and with redundancy in the contact</text><text class="n" x="44" y="428">&#160;&#160;&#160;set, not with stiffness, which is prescribed. A grasp guarantees both, being many persistent contacts on a light object.</text><line class="ed" x1="44" y1="444" x2="776" y2="444" stroke-dasharray="2 3"/><text class="n" x="44" y="460">Not a source of overlap, but a reason a number is ambiguous: an outer convex hull or decomposition contains the visual mesh, so it</text><text class="n" x="44" y="474">blocks contacts and hides overlap measured against that mesh, while an inscribed primitive admits overlap the solver never sees.</text><text class="n" x="44" y="488">PhysX 5 uses SDF collision on non-convex bodies and skips the decomposition. A penetration number must name the geometry it used.</text><text class="h" style="font-size:10px" x="44" y="506">The depth is computable from the poses and the meshes. IsaacGymEnvs&#8217; IndustReal task already gates its policy update on it at 1 mm.</text><path class="edw" d="M410,230 L410,254" marker-end="url(#arw)"/><path class="edw" d="M566,230 L566,254" marker-end="url(#arw)"/><path class="edw" d="M722,230 L722,254" marker-end="url(#arw)"/></svg>