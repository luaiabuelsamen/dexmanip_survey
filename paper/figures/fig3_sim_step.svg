<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 510" width="820" height="510" role="img" aria-label="A simulation step and where engines differ"><style>
 :root{--ink:#111418;--mut:#5b6672;--line:#c3ccd4;--bg:#ffffff;--a:#2f6f9f;--b:#7a5ea8;--c:#a8563e;--d:#3f7d57;--warn:#b5462f;--fill:#eef3f7;--fill2:#f4f1f8}
 @media (prefers-color-scheme:dark){:root{--ink:#e8ecef;--mut:#9aa6b2;--line:#3d4750;--bg:#12161a;--a:#6fb0dc;--b:#b295d8;--c:#dd9376;--d:#7fc09a;--warn:#e88a72;--fill:#1b232a;--fill2:#221e2b}}
 text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
 .t{font-size:15px;font-weight:600}.s{font-size:11.5px;fill:var(--mut)}.l{font-size:11.5px}
 .n{font-size:10px;fill:var(--mut)}.h{font-size:12px;font-weight:600}
 .box{fill:var(--fill);stroke:var(--line);stroke-width:1}
 .box2{fill:var(--fill2);stroke:var(--line);stroke-width:1}
 .ed{stroke:var(--mut);stroke-width:1.2;fill:none}
 .edw{stroke:var(--warn);stroke-width:1.4;fill:none;stroke-dasharray:4 3}
</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
<path d="M0,0 L7,3 L0,6 z" fill="var(--mut)"/></marker>
<marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
<path d="M0,0 L7,3 L0,6 z" fill="var(--warn)"/></marker></defs><rect width="820" height="510" fill="var(--bg)"/><text class="t" x="24" y="30">Figure 3. One simulation step, and where engines differ</text><text class="s" x="24" y="50">The stages every rigid-body engine runs. Under each, the choices that separate the engines used for hands.</text><text class="s" x="24" y="66">Dashed red marks where interpenetration is created or hidden from the user.</text><rect class="box" x="28" y="92" width="140" height="46" rx="4"/><text class="l" style="font-size:11.5px" x="98.0" y="116.0" text-anchor="middle">broad phase</text><text class="n" x="98.0" y="132.0" text-anchor="middle">which pairs might touch</text><path class="ed" d="M168,115.0 L181,115.0" marker-end="url(#ar)"/><rect class="box" x="184" y="92" width="140" height="46" rx="4"/><text class="l" style="font-size:11.5px" x="254.0" y="116.0" text-anchor="middle">narrow phase</text><text class="n" x="254.0" y="132.0" text-anchor="middle">contact points and normals</text><path class="ed" d="M324,115.0 L337,115.0" marker-end="url(#ar)"/><rect class="box" x="340" y="92" width="140" height="46" rx="4"/><text class="l" style="font-size:11.5px" x="410.0" y="116.0" text-anchor="middle">constraint assembly</text><text class="n" x="410.0" y="132.0" text-anchor="middle">friction cone, limits</text><path class="ed" d="M480,115.0 L493,115.0" marker-end="url(#ar)"/><rect class="box" x="496" y="92" width="140" height="46" rx="4"/><text class="l" style="font-size:11.5px" x="566.0" y="116.0" text-anchor="middle">solver</text><text class="n" x="566.0" y="132.0" text-anchor="middle">velocities and impulses</text><path class="ed" d="M636,115.0 L649,115.0" marker-end="url(#ar)"/><rect class="box" x="652" y="92" width="140" height="46" rx="4"/><text class="l" style="font-size:11.5px" x="722.0" y="116.0" text-anchor="middle">integrate</text><text class="n" x="722.0" y="132.0" text-anchor="middle">advance state</text><line class="ed" x1="98.0" y1="138" x2="98.0" y2="162" stroke-dasharray="2 3"/><text class="n" x="98.0" y="168" text-anchor="middle">PhysX: GPU SAP</text><text class="n" x="98.0" y="183" text-anchor="middle">MuJoCo: broadphase</text><text class="n" x="98.0" y="198" text-anchor="middle">Genesis: GPU tiles</text><line class="ed" x1="254.0" y1="138" x2="254.0" y2="162" stroke-dasharray="2 3"/><text class="n" x="254.0" y="168" text-anchor="middle">MuJoCo: convex, analytic</text><text class="n" x="254.0" y="183" text-anchor="middle">PhysX: SDF or convex hull</text><text class="n" x="254.0" y="198" text-anchor="middle">Dojo: exact, nonconvex</text><line class="ed" x1="410.0" y1="138" x2="410.0" y2="162" stroke-dasharray="2 3"/><text class="n" x="410.0" y="168" text-anchor="middle">MuJoCo: soft, pyramidal</text><text class="n" x="410.0" y="183" text-anchor="middle">Drake SAP: convex, regularised</text><text class="n" x="410.0" y="198" text-anchor="middle">Dojo: NCP, hard</text><line class="ed" x1="566.0" y1="138" x2="566.0" y2="162" stroke-dasharray="2 3"/><text class="n" x="566.0" y="168" text-anchor="middle">MuJoCo: PGS/CG/Newton</text><text class="n" x="566.0" y="183" text-anchor="middle">PhysX: TGS, fixed iters</text><text class="n" x="566.0" y="198" text-anchor="middle">Dojo: interior point</text><text class="n" x="566.0" y="213" text-anchor="middle">ComFree: closed form</text><line class="ed" x1="722.0" y1="138" x2="722.0" y2="162" stroke-dasharray="2 3"/><text class="n" x="722.0" y="168" text-anchor="middle">semi-implicit Euler</text><text class="n" x="722.0" y="183" text-anchor="middle">RK4 (Brax)</text><text class="n" x="722.0" y="198" text-anchor="middle">implicit (MuJoCo)</text><rect class="box2" x="28" y="248" width="764" height="96" rx="4"/><text class="h" x="44" y="270">Where penetration comes from</text><text class="n" x="44" y="290">&#8226; Soft contact admits penetration by construction: the contact force is a function of depth, so depth is never zero.</text><text class="n" x="44" y="306">&#8226; A fixed iteration budget leaves the constraint unconverged, so a stiff contact under load is resolved as overlap.</text><text class="n" x="44" y="322">&#8226; Convex decomposition replaces the mesh, so the object the solver sees is not the object the renderer draws.</text><text class="n" x="44" y="338">&#8226; Only some engines expose the resulting depth to the user; where they do not, a policy can exploit it unobserved.</text><path class="edw" d="M430,142 L430,242" marker-end="url(#arw)"/></svg>