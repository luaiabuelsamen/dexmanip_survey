<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" width="760" height="334" role="img" aria-label="What the method literature reports"><style>
 :root{--ink:#111418;--mut:#5b6672;--line:#d4dae0;--bg:#ffffff;--a:#2f6f9f;--b:#7a5ea8;--c:#a8563e;--d:#3f7d57;--warn:#b5462f;--fill:#e8eef3}
 @media (prefers-color-scheme:dark){:root{--ink:#e8ecef;--mut:#9aa6b2;--line:#39424b;--bg:#12161a;--a:#6fb0dc;--b:#b295d8;--c:#dd9376;--d:#7fc09a;--warn:#e88a72;--fill:#1d252c}}
 text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
 .t{font-size:15px;font-weight:600}.s{font-size:11.5px;fill:var(--mut)}.l{font-size:11.5px}.n{font-size:10.5px;fill:var(--mut)}
 .ax{stroke:var(--line);stroke-width:1}
</style><rect width="760" height="334" fill="var(--bg)"/><text class="t" x="24" y="30">Figure 6. What the method literature reports</text><text class="s" x="24" y="50">Share of the 112 surveyed method papers whose row records each item, each against its own</text><text class="s" x="24" y="66">denominator: the pale track is the rows the item can apply to, the grey tail the rows whose</text><text class="s" x="24" y="82">note did not settle it. A bar is evidence the item was stated, not that the work did it well.</text><text class="l" x="290" y="124" text-anchor="end">success criterion stated</text><rect x="300" y="112" width="380" height="15" rx="2" fill="var(--fill)"/><rect x="300" y="112" width="332" height="15" rx="2" fill="var(--a)"/><text class="n" x="688" y="124">98 of 112 (88%)</text><text class="l" x="290" y="152" text-anchor="end">real-robot experiment</text><rect x="300" y="140" width="376" height="15" rx="2" fill="var(--fill)"/><rect x="676" y="140" width="3" height="15" rx="2" fill="var(--mut)" opacity="0.35"/><rect x="300" y="140" width="301" height="15" rx="2" fill="var(--a)"/><text class="n" x="688" y="152">89 of 111 (80%) + 1 unsettled</text><text class="l" x="290" y="180" text-anchor="end">real trial count stated</text><rect x="300" y="168" width="301" height="15" rx="2" fill="var(--fill)"/><rect x="300" y="168" width="237" height="15" rx="2" fill="var(--a)"/><text class="n" x="688" y="180">70 of 89 (79%)</text><text class="l" x="290" y="208" text-anchor="end">unseen-object count stated</text><rect x="300" y="196" width="380" height="15" rx="2" fill="var(--fill)"/><rect x="300" y="196" width="132" height="15" rx="2" fill="var(--warn)"/><text class="n" x="688" y="208">39 of 112 (35%)</text><text class="l" x="290" y="236" text-anchor="end">contact or penetration handled</text><rect x="300" y="224" width="325" height="15" rx="2" fill="var(--fill)"/><rect x="625" y="224" width="54" height="15" rx="2" fill="var(--mut)" opacity="0.35"/><rect x="300" y="224" width="37" height="15" rx="2" fill="var(--warn)"/><text class="n" x="688" y="236">11 of 96 (11%) + 16 unsettled</text><text class="l" x="290" y="264" text-anchor="end">code released</text><rect x="300" y="252" width="366" height="15" rx="2" fill="var(--fill)"/><rect x="666" y="252" width="13" height="15" rx="2" fill="var(--mut)" opacity="0.35"/><rect x="300" y="252" width="210" height="15" rx="2" fill="var(--a)"/><text class="n" x="688" y="264">62 of 108 (57%) + 4 unsettled</text><text class="s" x="24" y="298">Red marks an item fewer than a third of the rows it applies to state. Every bar is a floor:</text><text class="s" x="24" y="314">a hand audit of the nulls recovered 15 trial counts, 19 criteria and 7 object counts (&#167;7.1).</text></svg>