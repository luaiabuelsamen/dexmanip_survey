<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" role="img" aria-label="What the method literature reports"><style>
 :root{--ink:#111418;--mut:#5b6672;--line:#d4dae0;--bg:#ffffff;--a:#2f6f9f;--b:#7a5ea8;--c:#a8563e;--d:#3f7d57;--warn:#b5462f;--fill:#e8eef3}
 @media (prefers-color-scheme:dark){:root{--ink:#e8ecef;--mut:#9aa6b2;--line:#39424b;--bg:#12161a;--a:#6fb0dc;--b:#b295d8;--c:#dd9376;--d:#7fc09a;--warn:#e88a72;--fill:#1d252c}}
 text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
 .t{font-size:15px;font-weight:600}.s{font-size:11.5px;fill:var(--mut)}.l{font-size:11.5px}.n{font-size:10.5px;fill:var(--mut)}
 .ax{stroke:var(--line);stroke-width:1}
</style><rect width="760" height="318" fill="var(--bg)"/><text class="t" x="24" y="30">Figure 6. What the method literature reports</text><text class="s" x="24" y="50">Share of the 110 surveyed method papers whose note confirms each item. A bar is</text><text class="s" x="24" y="66">evidence the item was stated, not that the work did it well.</text><text class="l" x="290" y="108" text-anchor="end">success criterion stated</text><rect x="300" y="96" width="380" height="15" rx="2" fill="var(--fill)"/><rect x="300" y="96" width="272" height="15" rx="2" fill="var(--a)"/><text class="n" x="688" y="108">79 (72%)</text><text class="l" x="290" y="136" text-anchor="end">real-robot experiment</text><rect x="300" y="124" width="380" height="15" rx="2" fill="var(--fill)"/><rect x="300" y="124" width="300" height="15" rx="2" fill="var(--a)"/><text class="n" x="688" y="136">87 (79%)</text><text class="l" x="290" y="164" text-anchor="end">real trial count stated</text><rect x="300" y="152" width="380" height="15" rx="2" fill="var(--fill)"/><rect x="300" y="152" width="190" height="15" rx="2" fill="var(--a)"/><text class="n" x="688" y="164">55 (50%)</text><text class="l" x="290" y="192" text-anchor="end">unseen-object count stated</text><rect x="300" y="180" width="380" height="15" rx="2" fill="var(--fill)"/><rect x="300" y="180" width="110" height="15" rx="2" fill="var(--warn)"/><text class="n" x="688" y="192">32 (29%)</text><text class="l" x="290" y="220" text-anchor="end">contact or penetration handled</text><rect x="300" y="208" width="380" height="15" rx="2" fill="var(--fill)"/><rect x="300" y="208" width="38" height="15" rx="2" fill="var(--warn)"/><text class="n" x="688" y="220">11 (10%)</text><text class="l" x="290" y="248" text-anchor="end">code released</text><rect x="300" y="236" width="380" height="15" rx="2" fill="var(--fill)"/><rect x="300" y="236" width="210" height="15" rx="2" fill="var(--a)"/><text class="n" x="688" y="248">61 (55%)</text><text class="s" x="24" y="282">Red marks an item fewer than a third of papers state. The two lowest are the two a reader</text><text class="s" x="24" y="298">needs in order to compare two methods at all.</text></svg>