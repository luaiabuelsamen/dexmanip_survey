</style><rect width="760" height="530" fill="var(--bg)"/><text class="t" x="24" y="30">Figure 2. Which hands the surveyed methods actually run on</text><text class="s" x="24" y="50">One count per method paper whose own experiments use the hand, from 97 method rows.</text><text class="s" x="24" y="66">Colour: blue sold commercially, green open hardware, purple simulation-only model.</text><text class="l" x="200" y="97" text-anchor="end">Allegro</text><rect x="210" y="86" width="420" height="14" rx="2" fill="var(--a)"/><text class="n" x="637" y="97">28</text><text class="l" x="200" y="119" text-anchor="end">Shadow</text><rect x="210" y="108" width="270" height="14" rx="2" fill="var(--a)"/><text class="n" x="487" y="119">18</text><text class="l" x="200" y="141" text-anchor="end">Inspire</text><rect x="210" y="130" width="240" height="14" rx="2" fill="var(--a)"/><text class="n" x="457" y="141">16</text><text class="l" x="200" y="163" text-anchor="end">parallel-jaw gripper</text><rect x="210" y="152" width="180" height="14" rx="2" fill="var(--a)"/><text class="n" x="397" y="163">12</text><text class="l" x="200" y="185" text-anchor="end">LEAP</text><rect x="210" y="174" width="120" height="14" rx="2" fill="var(--d)"/><text class="n" x="337" y="185">8</text><text class="l" x="200" y="207" text-anchor="end">Ability (PSYONIC)</text><rect x="210" y="196" width="90" height="14" rx="2" fill="var(--a)"/><text class="n" x="307" y="207">6</text><text class="l" x="200" y="229" text-anchor="end">XHand</text><rect x="210" y="218" width="90" height="14" rx="2" fill="var(--a)"/><text class="n" x="307" y="229">6</text><text class="l" x="200" y="251" text-anchor="end">Sharpa</text><rect x="210" y="240" width="75" height="14" rx="2" fill="var(--a)"/><text class="n" x="292" y="251">5</text><text class="l" x="200" y="273" text-anchor="end">Adroit (sim)</text><rect x="210" y="262" width="45" height="14" rx="2" fill="var(--b)"/><text class="n" x="262" y="273">3</text><text class="l" x="200" y="295" text-anchor="end">Fourier</text><rect x="210" y="284" width="45" height="14" rx="2" fill="var(--a)"/><text class="n" x="262" y="295">3</text><text class="l" x="200" y="317" text-anchor="end">D'Claw/TriFinger</text><rect x="210" y="306" width="30" height="14" rx="2" fill="var(--d)"/><text class="n" x="247" y="317">2</text><text class="l" x="200" y="339" text-anchor="end">Schunk</text><rect x="210" y="328" width="15" height="14" rx="2" fill="var(--a)"/><text class="n" x="232" y="339">1</text><text class="l" x="200" y="361" text-anchor="end">PsiBot</text><rect x="210" y="350" width="15" height="14" rx="2" fill="var(--a)"/><text class="n" x="232" y="361">1</text><text class="l" x="200" y="383" text-anchor="end">Faive/Mimic</text><rect x="210" y="372" width="15" height="14" rx="2" fill="var(--d)"/><text class="n" x="232" y="383">1</text><line class="ax" x1="24" y1="404" x2="736" y2="404"/><text class="l" x="200" y="439" text-anchor="end" fill="var(--warn)">announced humanoid hands</text><rect x="210" y="428" width="2" height="14" fill="var(--warn)"/><text class="n" x="219" y="439" fill="var(--warn)">0 &#8212; none of the 9 announced or prototype hands appears in any method row</text></svg>