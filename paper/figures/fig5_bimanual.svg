<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-label="Bimanual coordination architectures"><style>
 :root{--ink:#111418;--mut:#5b6672;--line:#c3ccd4;--bg:#ffffff;--a:#2f6f9f;--b:#7a5ea8;--c:#a8563e;--d:#3f7d57;--warn:#b5462f;--fill:#eef3f7;--fill2:#f4f1f8}
 @media (prefers-color-scheme:dark){:root{--ink:#e8ecef;--mut:#9aa6b2;--line:#3d4750;--bg:#12161a;--a:#6fb0dc;--b:#b295d8;--c:#dd9376;--d:#7fc09a;--warn:#e88a72;--fill:#1b232a;--fill2:#221e2b}}
 text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
 .t{font-size:15px;font-weight:600}.s{font-size:11.5px;fill:var(--mut)}.l{font-size:11.5px}
 .n{font-size:10px;fill:var(--mut)}.h{font-size:12px;font-weight:600}
 .box{fill:var(--fill);stroke:var(--line);stroke-width:1}
 .box2{fill:var(--fill2);stroke:var(--line);stroke-width:1}
 .ed{stroke:var(--mut);stroke-width:1.2;fill:none}
 .edw{stroke:var(--warn);stroke-width:1.4;fill:none;stroke-dasharray:4 3}
</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
<path d="M0,0 L7,3 L0,6 z" fill="var(--mut)"/></marker>
<marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
<path d="M0,0 L7,3 L0,6 z" fill="var(--warn)"/></marker></defs><rect width="820" height="340" fill="var(--bg)"/><text class="t" x="24" y="30">Figure 5. Four ways to control two dexterous hands</text><text class="s" x="24" y="50">Counts are surveyed bimanual method papers using each architecture.</text><rect class="box" x="28" y="76" width="182" height="140" rx="4"/><text class="h" x="119.0" y="96" text-anchor="middle">one policy, both hands</text><text class="n" x="119.0" y="118" text-anchor="middle">observation of both hands and object</text><text class="n" x="119.0" y="133" text-anchor="middle">one network</text><text class="n" x="119.0" y="148" text-anchor="middle">joint action vector</text><circle cx="78" cy="178" r="9" class="box2"/><circle cx="160" cy="178" r="9" class="box2"/><rect class="box2" x="96" y="152" width="46" height="16" rx="3"/><path class="ed" d="M87,178 L96,164" marker-end="url(#ar)"/><path class="ed" d="M151,178 L142,164" marker-end="url(#ar)"/><rect class="box" x="224" y="76" width="182" height="140" rx="4"/><text class="h" x="315.0" y="96" text-anchor="middle">two policies, shared observation</text><text class="n" x="315.0" y="118" text-anchor="middle">each hand its own network</text><text class="n" x="315.0" y="133" text-anchor="middle">both see the same state</text><circle cx="274" cy="178" r="9" class="box2"/><circle cx="356" cy="178" r="9" class="box2"/><rect class="box2" x="252" y="150" width="44" height="14" rx="3"/><rect class="box2" x="334" y="150" width="44" height="14" rx="3"/><line class="ed" x1="296" y1="157" x2="334" y2="157" stroke-dasharray="3 3"/><rect class="box" x="420" y="76" width="182" height="140" rx="4"/><text class="h" x="511.0" y="96" text-anchor="middle">leader and follower</text><text class="n" x="511.0" y="118" text-anchor="middle">one hand assigned the dominant role</text><text class="n" x="511.0" y="133" text-anchor="middle">the other reacts to it</text><circle cx="470" cy="178" r="11" class="box2" stroke="var(--a)"/><circle cx="552" cy="178" r="8" class="box2"/><path class="ed" d="M483,178 L541,178" marker-end="url(#ar)"/><rect class="box" x="616" y="76" width="182" height="140" rx="4"/><text class="h" x="707.0" y="96" text-anchor="middle">relative frame</text><text class="n" x="707.0" y="118" text-anchor="middle">action expressed between the hands</text><text class="n" x="707.0" y="133" text-anchor="middle">or in the object frame</text><circle cx="666" cy="178" r="9" class="box2"/><circle cx="748" cy="178" r="9" class="box2"/><line class="ed" x1="675" y1="178" x2="739" y2="178" stroke-dasharray="3 2"/><text class="n" x="707" y="172" text-anchor="middle">&#916;</text><text class="s" x="24" y="246">The field is concentrated in the first panel. The two on the right are where the structure of the problem is</text><text class="s" x="24" y="262">actually used, and both are represented by a handful of papers.</text></svg>