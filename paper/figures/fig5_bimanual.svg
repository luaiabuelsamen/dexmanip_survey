<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 366" width="820" height="366" role="img" aria-label="Bimanual coordination architectures"><style>
 :root{--ink:#111418;--mut:#5b6672;--line:#c3ccd4;--bg:#ffffff;--a:#2f6f9f;--b:#7a5ea8;--c:#a8563e;--d:#3f7d57;--warn:#b5462f;--fill:#eef3f7;--fill2:#f4f1f8}
 @media (prefers-color-scheme:dark){:root{--ink:#e8ecef;--mut:#9aa6b2;--line:#3d4750;--bg:#12161a;--a:#6fb0dc;--b:#b295d8;--c:#dd9376;--d:#7fc09a;--warn:#e88a72;--fill:#1b232a;--fill2:#221e2b}}
 text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
 .t{font-size:15px;font-weight:600}.s{font-size:11.5px;fill:var(--mut)}.l{font-size:11.5px}
 .n{font-size:10px;fill:var(--mut)}.h{font-size:12px;font-weight:600}
 .k{font-size:9px;fill:var(--mut);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 .cnt{font-size:13px;font-weight:700;fill:var(--a)}
 .box{fill:var(--fill);stroke:var(--line);stroke-width:1}
 .box2{fill:var(--fill2);stroke:var(--line);stroke-width:1}
 .ed{stroke:var(--mut);stroke-width:1.2;fill:none}
 .edw{stroke:var(--warn);stroke-width:1.4;fill:none;stroke-dasharray:4 3}
</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
<path d="M0,0 L7,3 L0,6 z" fill="var(--mut)"/></marker>
<marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
<path d="M0,0 L7,3 L0,6 z" fill="var(--warn)"/></marker></defs><rect width="820" height="366" fill="var(--bg)"/><text class="t" x="24" y="30">Figure 5. Four ways to control two dexterous hands</text><text class="s" x="24" y="50">Counts are the 25 corpus papers that put a learned controller on two dexterous hands. Two are counted twice.</text><rect class="box" x="28" y="72" width="182" height="188" rx="4" stroke-width="2.2" stroke="var(--a)"/><text class="h" x="119.0" y="92" text-anchor="middle">one policy, both hands</text><text class="cnt" x="119.0" y="110" text-anchor="middle">19 of 25</text><text class="n" x="119.0" y="128" text-anchor="middle">observation of both hands and object</text><text class="n" x="119.0" y="141" text-anchor="middle">one network, joint action vector</text><circle cx="78" cy="188" r="9" class="box2"/><circle cx="160" cy="188" r="9" class="box2"/><rect class="box2" x="96" y="162" width="46" height="16" rx="3"/><path class="ed" d="M87,188 L96,174" marker-end="url(#ar)"/><path class="ed" d="M151,188 L142,174" marker-end="url(#ar)"/><text class="k" x="119.0" y="215" text-anchor="middle">twisting_lids_2024  dexmachina_2025</text><text class="k" x="119.0" y="227" text-anchor="middle">maniptrans_2025  dexman_2025</text><text class="k" x="119.0" y="239" text-anchor="middle">robopianist_2023  gr_dexter_2025</text><text class="k" x="119.0" y="251" text-anchor="middle">and 13 more</text><rect class="box" x="224" y="72" width="182" height="188" rx="4"/><text class="h" x="315.0" y="92" text-anchor="middle">two policies, per hand</text><text class="cnt" x="315.0" y="110" text-anchor="middle">5 of 25</text><text class="n" x="315.0" y="128" text-anchor="middle">each hand its own network</text><text class="n" x="315.0" y="141" text-anchor="middle">centralised critic, or own obs. only</text><circle cx="274" cy="188" r="9" class="box2"/><circle cx="356" cy="188" r="9" class="box2"/><rect class="box2" x="252" y="160" width="44" height="14" rx="3"/><rect class="box2" x="334" y="160" width="44" height="14" rx="3"/><line class="ed" x1="296" y1="167" x2="334" y2="167" stroke-dasharray="3 3"/><text class="k" x="315.0" y="215" text-anchor="middle">bidexhands_2022 (MARL baselines)</text><text class="k" x="315.0" y="227" text-anchor="middle">bidexhd_2024  artigrasp_2023</text><text class="k" x="315.0" y="239" text-anchor="middle">dynamic_handover_2023</text><text class="k" x="315.0" y="251" text-anchor="middle">dydexhandover_2025</text><rect class="box" x="420" y="72" width="182" height="188" rx="4"/><text class="h" x="511.0" y="92" text-anchor="middle">leader and follower</text><text class="cnt" x="511.0" y="110" text-anchor="middle">2 of 25</text><text class="n" x="511.0" y="128" text-anchor="middle">one hand assigned the dominant role</text><text class="n" x="511.0" y="141" text-anchor="middle">the other reacts to it</text><circle cx="470" cy="188" r="11" class="box2" stroke="var(--a)"/><circle cx="552" cy="188" r="8" class="box2"/><path class="ed" d="M483,188 L541,188" marker-end="url(#ar)"/><text class="k" x="511.0" y="215" text-anchor="middle">asymdex_2024</text><text class="k" x="511.0" y="227" text-anchor="middle">dexterous_handover_2025,</text><text class="k" x="511.0" y="239" text-anchor="middle">whose leader is a scripted arm</text><text class="k" x="511.0" y="251" text-anchor="middle">and is never learned</text><rect class="box" x="616" y="72" width="182" height="188" rx="4"/><text class="h" x="707.0" y="92" text-anchor="middle">relative frame</text><text class="cnt" x="707.0" y="110" text-anchor="middle">1 of 25</text><text class="n" x="707.0" y="128" text-anchor="middle">action expressed between the hands</text><text class="n" x="707.0" y="141" text-anchor="middle">or in the held object's frame</text><circle cx="666" cy="188" r="9" class="box2"/><circle cx="748" cy="188" r="9" class="box2"/><line class="ed" x1="675" y1="188" x2="739" y2="188" stroke-dasharray="3 2"/><text class="n" x="707" y="182" text-anchor="middle">&#916;</text><text class="k" x="707.0" y="215" text-anchor="middle">asymdex_2024</text><text class="k" x="707.0" y="227" text-anchor="middle">dexmimicgen_2024 preserves it</text><text class="k" x="707.0" y="239" text-anchor="middle">offline, when generating data,</text><text class="k" x="707.0" y="251" text-anchor="middle">not in the policy's observation</text><text class="s" x="24" y="290">The field is concentrated in the first panel. The two on the right are where the structure of the problem is</text><text class="s" x="24" y="306">actually used, and asymdex_2024 is the only corpus paper that puts either one inside a policy.</text></svg>