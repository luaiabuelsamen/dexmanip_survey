"/><text class="l" x="632" y="324">BC</text><text class="n" x="760" y="324" text-anchor="end">27</text><rect class="box" x="623" y="365" width="146" height="65" rx="3"/><text class="l" x="632" y="401">distillation</text><text class="n" x="760" y="401" text-anchor="end">23</text><rect class="box" x="623" y="439" width="146" height="57" rx="3"/><text class="l" x="632" y="471">VLA</text><text class="n" x="760" y="471" text-anchor="end">18</text><rect class="box" x="623" y="505" width="146" height="51" rx="3"/><text class="l" x="632" y="534">teleop-system</text><text class="n" x="760" y="534" text-anchor="end">14</text><rect class="box" x="623" y="565" width="146" height="51" rx="3"/><text class="l" x="632" y="594">diffusion</text><text class="n" x="760" y="594" text-anchor="end">14</text><text class="h" x="897" y="104" text-anchor="middle">evaluation</text><text class="n" x="897" y="122" text-anchor="middle">Sec. 7</text><path class="rule" d="M824,132 L970,132"/><rect class="box" x="824" y="148" width="146" height="172" rx="3"/><text class="l" x="833" y="238">real robot</text><text class="n" x="961" y="238" text-anchor="end">89</text><rect class="box" x="824" y="329" width="146" height="67" rx="3"/><text class="l" x="833" y="366">simulation only</text><text class="n" x="961" y="366" text-anchor="end">24</text><rect class="box" x="824" y="405" width="146" height="47" rx="3" fill="var(--fill2)" stroke="var(--b)"/><text class="l" x="833" y="427">penetration</text><text class="l" x="833" y="441">addressed</text><text class="n" x="961" y="433" text-anchor="end">12</text><rect class="box" x="824" y="461" width="146" height="166" rx="3" fill="var(--fill2)" stroke="var(--b)"/><text class="l" x="833" y="542">penetration</text><text class="l" x="833" y="556">silent</text><text class="n" x="961" y="548" text-anchor="end">85</text><text class="s" x="24" y="653">The routes converge. The heaviest single path is no demonstrations, one hand, Isaac Gym, reinforcement learning, real robot.</text><text class="s" x="24" y="671">Whatever enters on the left, almost everything leaves through a GPU simulator and arrives at a real robot without contact</text><text class="s" x="24" y="689">quality ever being measured.</text></svg>