"/><text class="l" x="632" y="321">BC</text><text class="n" x="760" y="321" text-anchor="end">27</text><rect class="box" x="623" y="362" width="146" height="65" rx="3"/><text class="l" x="632" y="399">distillation</text><text class="n" x="760" y="399" text-anchor="end">23</text><rect class="box" x="623" y="436" width="146" height="57" rx="3"/><text class="l" x="632" y="469">VLA</text><text class="n" x="760" y="469" text-anchor="end">18</text><rect class="box" x="623" y="503" width="146" height="51" rx="3"/><text class="l" x="632" y="532">teleop-system</text><text class="n" x="760" y="532" text-anchor="end">14</text><rect class="box" x="623" y="562" width="146" height="51" rx="3"/><text class="l" x="632" y="591">diffusion</text><text class="n" x="760" y="591" text-anchor="end">14</text><text class="h" x="897" y="104" text-anchor="middle">evaluation</text><text class="n" x="897" y="122" text-anchor="middle">Sec. 7</text><path class="rule" d="M824,132 L970,132"/><rect class="box" x="824" y="148" width="146" height="172" rx="3"/><text class="l" x="833" y="238">real robot</text><text class="n" x="961" y="238" text-anchor="end">89</text><rect class="box" x="824" y="329" width="146" height="65" rx="3"/><text class="l" x="833" y="366">simulation only</text><text class="n" x="961" y="366" text-anchor="end">23</text><rect class="box" x="824" y="403" width="146" height="46" rx="3" fill="var(--fill2)" stroke="var(--b)"/><text class="l" x="833" y="424">penetration</text><text class="l" x="833" y="438">addressed</text><text class="n" x="961" y="430" text-anchor="end">11</text><rect class="box" x="824" y="458" width="146" height="166" rx="3" fill="var(--fill2)" stroke="var(--b)"/><text class="l" x="833" y="539">penetration</text><text class="l" x="833" y="553">silent</text><text class="n" x="961" y="545" text-anchor="end">85</text><text class="s" x="24" y="650">The routes converge. The heaviest single path is no demonstrations, one hand, Isaac Gym, reinforcement learning, real robot.</text><text class="s" x="24" y="668">Whatever enters on the left, almost everything leaves through a GPU simulator and arrives at a real robot without contact</text><text class="s" x="24" y="686">quality ever being measured.</text></svg>